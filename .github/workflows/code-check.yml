
name: Game Code Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check Game Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'

      - name: Check required files
        run: |
          test -f games/prototypes/early-canvas/index.html
          test -f README.md
          test -f docs/GAME_CONCEPT.md
          test -f docs/PROGRESS.md
          echo "Required files found."

      - name: Check JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const html = fs.readFileSync('games/prototypes/early-canvas/index.html', 'utf8');
          const scripts = [...html.matchAll(
            /<script\b[^>]*>([\s\S]*?)<\/script>/gi
          )].map(match => match[1]).filter(s => s.trim());

          if (scripts.length === 0) {
            throw new Error('No inline JavaScript found.');
          }

          for (const script of scripts) {
            new Function(script);
          }

          console.log('JavaScript syntax check passed.');
          NODE

      - name: Build Missed This Stop
        working-directory: missed-this-stop
        run: |
          npm ci
          npm run build

      - name: Build The Open Wild
        working-directory: games/open-wild
        run: |
          npm ci
          npm run build -- --base ./

      - name: Upload Open Wild review build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: open-wild-pr-build
          path: games/open-wild/dist
          if-no-files-found: error
