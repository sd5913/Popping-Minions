name: Deploy Open Wild to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "games/open-wild/**"
      - ".github/workflows/open-wild-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: open-wild-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/configure-pages@v5
      - name: Build Open Wild
        working-directory: games/open-wild
        run: |
          npm ci
          npm run build -- --base ./
      - uses: actions/upload-pages-artifact@v3
        with:
          path: games/open-wild/dist
      - uses: actions/deploy-pages@v4
        id: deployment
