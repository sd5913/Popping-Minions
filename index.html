
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Next Stop — Prototype</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #19232b;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }

    canvas {
      width: min(95vw, 960px);
      aspect-ratio: 16 / 9;
      background: #64788a;
      border-radius: 8px;
    }

    p {
      color: #d1d9df;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h2>The Next Stop</h2>
  <canvas id="game" width="960" height="540"></canvas>
  <p>Use ←/→ to move · Space to jump · E to talk</p>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    let lane = 1;
    const lanePositions = [340, 480, 620];
    let animationOffset = 0;
    let obstacleProgress = 0;
    let lastFrameTime = null;
let collisionCount = 0;
let collisionFeedbackUntil = 0;
let route = "main";
let fallStartTime = 0;
let fallProgress = 0;
let jumpStartTime = -Infinity;

// NPC interaction state
let npcDialogIndex = -1;
let npcFinished = false;

const npcDialogues = [
  ["Stranger", "You look worried. What happened?"],
  ["Student", "I missed my train. I might miss my exam!"],
  ["Stranger", "A different path is not the end of your journey."],
  ["Student", "Maybe I can still find another way forward."]
];

    function drawObstacle() {
  const y = 220 + obstacleProgress * 350;
  const x = 480;

  // Perspective scaling
  const scale = 0.25 + obstacleProgress * 1.5;

  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);

  // Pencil body
  ctx.fillStyle = "#f5d65c";
  ctx.fillRect(-12, -55, 24, 55);

  // Pencil tip
  ctx.beginPath();
  ctx.moveTo(-12, -55);
  ctx.lineTo(0, -75);
  ctx.lineTo(12, -55);
  ctx.closePath();
  ctx.fillStyle = "#d9ad85";
  ctx.fill();

  // Pencil lead
  ctx.beginPath();
  ctx.moveTo(-4, -68);
  ctx.lineTo(0, -75);
  ctx.lineTo(4, -68);
  ctx.closePath();
  ctx.fillStyle = "#30343b";
  ctx.fill();

  // Warning stripes
  ctx.fillStyle = "#30343b";
  ctx.fillRect(-12, -20, 24, 6);
  ctx.fillRect(-12, -8, 24, 6);

  ctx.restore();
}
    function drawScene() {
      // Station background
      ctx.fillStyle = "#64788a";
      ctx.fillRect(0, 0, 960, 540);

      // Distant station entrance
      ctx.fillStyle = "#354552";
      ctx.fillRect(350, 95, 260, 145);

      // Station clock
      ctx.beginPath();
      ctx.arc(480, 115, 38, 0, Math.PI * 2);
      ctx.fillStyle = "#e7e3d8";
      ctx.fill();
      ctx.strokeStyle = "#d15d50";
      ctx.lineWidth = 6;
      ctx.stroke();

      // Clock hands
      ctx.beginPath();
      ctx.moveTo(480, 115);
      ctx.lineTo(480, 94);
      ctx.moveTo(480, 115);
      ctx.lineTo(498, 125);
      ctx.strokeStyle = "#354552";
      ctx.lineWidth = 4;
      ctx.stroke();

      // Perspective road
      ctx.beginPath();
      ctx.moveTo(420, 220);
      ctx.lineTo(540, 220);
      ctx.lineTo(850, 540);
      ctx.lineTo(110, 540);
      ctx.closePath();
      ctx.fillStyle = route === "lower" ? "#85a9ae" : "#bac4ca";
      ctx.fill();

      // Lane markings
      ctx.strokeStyle = "#e9edf0";
      ctx.lineWidth = 4;
      ctx.setLineDash([16, 20]);
      ctx.lineDashOffset = -animationOffset;

      for (const bottomX of [370, 590]) {
        ctx.beginPath();
        ctx.moveTo(480, 220);
        ctx.lineTo(bottomX, 540);
        ctx.stroke();
      }

      ctx.setLineDash([]);
      ctx.lineDashOffset = 0;

      // Draw approaching obstacle
      if (route === "main") drawObstacle();

      // Player
      const x = lanePositions[lane];
      const y = 420;

  ctx.save();
  const jumpElapsed = performance.now() - jumpStartTime;
  if (jumpElapsed < 700) {
    const jumpHeight = 85 * Math.sin(Math.PI * jumpElapsed / 700);
    ctx.translate(0, -jumpHeight);
  }
  if (route === "falling") {
    const drop = Math.sin(fallProgress * Math.PI) * 90;
    ctx.translate(0, drop);
  }

      // Legs
      ctx.fillStyle = "#29313c";
      ctx.fillRect(x - 17, y + 42, 13, 43);
      ctx.fillRect(x + 4, y + 42, 13, 43);

      // Light-colored jacket
      ctx.fillStyle = "#e7e0d2";
      ctx.fillRect(x - 23, y - 6, 46, 55);

      // Orange-red backpack
      ctx.fillStyle = "#dd694b";
      ctx.fillRect(x - 20, y + 3, 40, 43);

      // Head
      ctx.fillStyle = "#e0b49a";
      ctx.beginPath();
      ctx.arc(x, y - 20, 17, 0, Math.PI * 2);
      ctx.fill();

      // Short hair
      ctx.fillStyle = "#252b30";
      ctx.fillRect(x - 17, y - 38, 34, 13);
  ctx.restore();
    }

    document.addEventListener("keydown", (event) => {
      if (npcDialogIndex >= 0) return;
      if (event.key === "ArrowLeft") {
        event.preventDefault();
        lane = Math.max(0, lane - 1);
      }

      if (event.key === "ArrowRight") {
        event.preventDefault();
        lane = Math.min(2, lane + 1);
      }

      drawScene();
    });

    
function drawNPC() {
  ctx.save();

  // A simple NPC standing beside the lower road
  ctx.fillStyle = "#75638f";
  ctx.fillRect(730, 425, 40, 67);

  ctx.fillStyle = "#f1bf9e";
  ctx.beginPath();
  ctx.arc(750, 409, 21, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#47364f";
  ctx.fillRect(727, 383, 46, 12);

  ctx.textAlign = "center";
  ctx.fillStyle = "#fff4dc";
  ctx.font = "bold 17px Arial";
  ctx.fillText("STRANGER", 750, 369);

  if (!npcFinished && npcDialogIndex < 0) {
    ctx.fillStyle = "#fff0aa";
    ctx.font = "bold 18px Arial";
    ctx.fillText("Press E to talk", 750, 520);
  }
  ctx.restore();
}

function drawNPCDialogue() {
  if (npcDialogIndex < 0) return;

  const [speaker, line] = npcDialogues[npcDialogIndex];

  ctx.save();
  ctx.fillStyle = "rgba(21, 31, 47, 0.96)";
  ctx.fillRect(45, 325, 870, 185);

  ctx.strokeStyle = "#9ceadf";
  ctx.lineWidth = 3;
  ctx.strokeRect(45, 325, 870, 185);

  ctx.fillStyle = "#9ceadf";
  ctx.font = "bold 25px Arial";
  ctx.fillText(speaker, 75, 370);

  ctx.fillStyle = "#ffffff";
  ctx.font = "21px Arial";
  ctx.fillText(line, 75, 421, 810);

  ctx.fillStyle = "#d6dce8";
  ctx.font = "16px Arial";
  ctx.fillText("Press E to continue", 75, 479);

  ctx.restore();
}

function drawLowerRouteMessage() {
  ctx.fillStyle = "rgba(24, 54, 61, 0.88)";
  ctx.fillRect(20, 20, 335, 78);

  ctx.fillStyle = "#fff2da";
  ctx.font = "bold 22px Arial";
  ctx.fillText("A Different Path", 35, 52);

  ctx.font = "15px Arial";
  ctx.fillText("The journey continues.", 35, 78);
}

function drawCollisionFeedback(timestamp) {
  if (timestamp >= collisionFeedbackUntil) return;

  ctx.fillStyle = "rgba(60, 35, 40, 0.9)";
  ctx.fillRect(20, 20, 290, 75);

  ctx.fillStyle = "#fff2e8";
  ctx.font = "bold 22px Arial";
  ctx.fillText("Hit! Keep going.", 35, 52);

  ctx.font = "15px Arial";
  ctx.fillText("Mistakes do not end the journey.", 35, 77);
}

document.addEventListener("keydown", (event) => {
  if (npcDialogIndex >= 0 || event.code !== "Space") return;

  event.preventDefault();
  if (event.repeat) return;

  const elapsed = performance.now() - jumpStartTime;

  if (elapsed >= 700 && route !== "falling") {
    jumpStartTime = performance.now();
  }
});

document.addEventListener("keydown", (event) => {
  if (event.key.toLowerCase() !== "e" || route !== "lower") return;
  event.preventDefault();

  if (event.repeat || npcFinished) return;

  npcDialogIndex++;

  if (npcDialogIndex >= npcDialogues.length) {
    npcDialogIndex = -1;
    npcFinished = true;
  }
});

function animate(timestamp) {
  const deltaTime = lastFrameTime === null
    ? 0
    : Math.min(timestamp - lastFrameTime, 50);

  lastFrameTime = timestamp;

  // Road movement
  if (npcDialogIndex < 0) {
    animationOffset = (animationOffset + deltaTime * 0.12) % 36;
  }

  // Obstacle movement
  const previousProgress = obstacleProgress;
  obstacleProgress += deltaTime / 3000;

  // Detect a collision when the obstacle reaches the player
  if (
    previousProgress < 0.73 &&
    obstacleProgress >= 0.73 &&
    lane === 1 &&
    route === "main" 
  ) {
    collisionCount++;
    collisionFeedbackUntil = timestamp + 1200;
    route = "falling";
    fallStartTime = timestamp;
    fallProgress = 0;
  }

  // Transition to the lower route after falling
  if (route === "falling") {
    fallProgress = Math.min(
      (timestamp - fallStartTime) / 900,
      1
    );

    if (fallProgress >= 1) {
      route = "lower";
    }
  }

  // Restart obstacle from the distance
  if (obstacleProgress > 1.1) {
    obstacleProgress = 0;
  }

  drawScene();
  drawCollisionFeedback(timestamp);
  if (route === "lower") {
    drawLowerRouteMessage();
    drawNPC();
    drawNPCDialogue();
  }

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
  </script>

</body>
</html>
